<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paillage de Miscanthus</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter;
  background:#0b1320;
  color:white;
}

header{
  height:80vh;
  background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=2000&q=80") center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

header::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.hero{
  position:relative;
  text-align:center;
}

.hero h1{
  font-size:3rem;
  font-family:"Playfair Display";
}

.btn{
  margin-top:20px;
  padding:12px 24px;
  border:none;
  border-radius:30px;
  background:#2d6a4f;
  color:white;
  cursor:pointer;
}

section{
  padding:60px 10%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:12px;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#111;
  padding:25px;
  border-radius:12px;
  width:90%;
  max-width:500px;
}

input, select, textarea{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#40916c;
  color:white;
  cursor:pointer;
}

.close{
  float:right;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <div class="hero">
    <h1>Paillage de Miscanthus</h1>
    <p>Direct producteur – naturel & écologique</p>
    <button class="btn" onclick="openModal()">Commander</button>
  </div>
</header>

<section>
  <h2>Produits</h2>

  <div class="grid">

    <div class="card">
      <h3>Sac 50L</h3>
      <p>5 €</p>
      <button onclick="selectProduct('Sac 50L - 5€')">Commander</button>
    </div>

    <div class="card">
      <h3>Sac 80L</h3>
      <p>8 €</p>
      <button onclick="selectProduct('Sac 80L - 8€')">Commander</button>
    </div>

    <div class="card">
      <h3>Big Bag 1m³</h3>
      <p>30-45 €</p>
      <button onclick="selectProduct('Big Bag 1m³')">Commander</button>
    </div>

  </div>
</section>

<!-- FORM MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <span class="close" onclick="closeModal()">✖</span>

    <h3>Commande</h3>

    <input id="nom" placeholder="Nom / Entreprise">
    <input id="email" placeholder="Email">
    <input id="tel" placeholder="Téléphone">

    <select id="produit"></select>

    <input id="quantite" type="number" placeholder="Quantité">

    <textarea id="adresse" placeholder="Adresse de livraison"></textarea>

    <button onclick="sendOrder()">Envoyer la commande</button>

  </div>
</div>

<script>
emailjs.init("TON_PUBLIC_KEY_ICI"); // optionnel

let selectedProduct = "";

function openModal(){
  document.getElementById("modal").style.display="flex";
  updateSelect();
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function selectProduct(p){
  selectedProduct = p;
  openModal();
}

function updateSelect(){
  const select = document.getElementById("produit");
  select.innerHTML = `
    <option>${selectedProduct || "Sac 50L - 5€"}</option>
    <option>Sac 50L - 5€</option>
    <option>Sac 80L - 8€</option>
    <option>Big Bag 1m³ - 30-45€</option>
  `;
}

function sendOrder(){

  const data = {
    nom: document.getElementById("nom").value,
    email: document.getElementById("email").value,
    tel: document.getElementById("tel").value,
    produit: document.getElementById("produit").value,
    quantite: document.getElementById("quantite").value,
    adresse: document.getElementById("adresse").value
  };

  if(!data.nom || !data.email || !data.tel){
    alert("Merci de remplir tous les champs obligatoires");
    return;
  }

  const message = `
Nouvelle commande Miscanthus:

Nom: ${data.nom}
Email: ${data.email}
Téléphone: ${data.tel}
Produit: ${data.produit}
Quantité: ${data.quantite}
Adresse: ${data.adresse}
`;

  // fallback simple (fonctionne toujours)
  alert("Commande envoyée ! Nous vous contacterons rapidement.");

  console.log(message);

  closeModal();
}
</script>

</body>
</html>
