<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paillage de Miscanthus | Producteur direct</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --green:#2d6a4f;
  --green2:#40916c;
  --dark:#0b1320;
  --card:rgba(255,255,255,0.06);
  --text:#eaf4f4;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,sans-serif;
  background:var(--dark);
  color:var(--text);
}

/* HERO */
header{
  height:90vh;
  background:url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=2000&q=80") center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

header::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0.3),var(--dark));
}

.hero{
  text-align:center;
  max-width:900px;
  padding:20px;
  z-index:2;
}

.hero h1{
  font-family:"Playfair Display";
  font-size:3.8rem;
}

.hero p{
  margin-top:15px;
  opacity:0.85;
  font-size:1.1rem;
}

.cta{
  margin-top:25px;
  padding:12px 26px;
  border:none;
  border-radius:30px;
  background:var(--green2);
  color:white;
  font-weight:600;
  cursor:pointer;
}

.cta:hover{
  background:var(--green);
}

/* SECTIONS */
section{
  padding:80px 10%;
}

h2{
  font-family:"Playfair Display";
  font-size:2.2rem;
  margin-bottom:30px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:15px;
  backdrop-filter:blur(10px);
}

/* PRICES */
.price{
  font-size:2rem;
  color:#52b788;
  margin:10px 0;
}

/* FORM */
form{
  display:grid;
  gap:15px;
  max-width:600px;
}

input, select, textarea{
  padding:12px;
  border-radius:10px;
  border:none;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--green2);
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* CONTACT */
.contact{
  background:rgba(255,255,255,0.04);
  padding:20px;
  border-radius:15px;
}
</style>
</head>

<body>

<header>
  <div class="hero">
    <h1>Paillage de Miscanthus</h1>
    <p>Direct producteur – solution naturelle pour jardins, maraîchage et collectivités</p>
    <button class="cta" onclick="document.getElementById('commande').scrollIntoView()">
      Commander
    </button>
  </div>
</header>

<section>
<h2>Pourquoi ce paillage ?</h2>

<div class="grid">
  <div class="card">
    <h3>🌿 100% naturel</h3>
    <p>Produit sans traitement chimique, biodégradable et durable.</p>
  </div>

  <div class="card">
    <h3>💧 Anti-mauvaises herbes</h3>
